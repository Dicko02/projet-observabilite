    Port                   3100
    Labels                 job=fluent-bit
    Label_Keys             $level,$service,$env,$type,$trace_id,$host
    Line_Format            json
    Auto_Kubernetes_Labels off
    Retry_Limit            False


# ============================================================
# PIPELINE : BACKOFFICE (PHP/Laravel)
# Parser : backoffice-laravel (une ligne = un événement)
# Pas de multiline — chaque ligne porte son propre timestamp
# Pas de trace_id — pas d'OTel pour PHP pour l'instant
# ============================================================
[INPUT]
    Name             tail
    Path             /logs/backoffice/backoffice-*.log
    Tag              backoffice
    Parser           backoffice-laravel
    DB               /tmp/fluent-bit-backoffice.db
    Refresh_Interval 5

# WARNING → WARN pour cohérence avec le reste des services Loki
[FILTER]
    Name             modify
    Match            backoffice
    Condition        Key_Value_Equals level WARNING
    Set              level WARN

[FILTER]
    Name             record_modifier
    Match            backoffice
    Record           service ${BACKOFFICE_SERVICE_NAME}
    Record           env     ${ENV_NAME}
    Record           host    ${BACKOFFICE_HOST_NAME}

[FILTER]
    Name    lua
    Match   backoffice
    script  /fluent-bit/etc/mask_secrets.lua
    call    mask_sensitive

[OUTPUT]
    Name                   loki
    Match                  backoffice
    Host                   loki
    Port                   3100
    Labels                 job=fluent-bit
    Label_Keys             $level,$service,$env,$host
    Line_Format            json
    Auto_Kubernetes_Labels off
    Retry_Limit            False



# ==============================
# CONFIGURATION GENERALE
# ==============================
[SERVICE]
    Flush           2
    Daemon          Off
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf


# ============================================================
# PIPELINE : SERVICE MIDDLE
# ============================================================
[INPUT]
    Name             tail
    Path             /logs/middle/middleware*.log
    Tag              middle
    Multiline.Parser multiline-logback
    DB               /tmp/fluent-bit-middle.db
    Refresh_Interval 5

[FILTER]
    Name             parser
    Match            middle
    Key_Name         log
    Parser           logback
    Parser           json-generic
    Parser           generic-line
    Reserve_Data     On
    Preserve_Key     On

[FILTER]
    Name             modify
    Match            middle
    Condition        Key_Value_Matches thread ${BATCH_THREAD_PATTERN}
    Add              type batch

[FILTER]
    Name             record_modifier
    Match            middle
    Record           service ${SERVICE_NAME}
    Record           env     ${ENV_NAME}
    Record           host    ${MIDDLE_HOST_NAME}

# ── MASQUAGE DONNÉES SENSIBLES ──────────────────────────────
[FILTER]
    Name    lua
    Match   middle
    script  /fluent-bit/etc/mask_secrets.lua
    call    mask_sensitive

[OUTPUT]
    Name                   loki
    Match                  middle
    Host                   loki
    Port                   3100
    Labels                 job=fluent-bit
    Label_Keys             $level,$service,$env,$type,$trace_id,$host
    Line_Format            json
    Auto_Kubernetes_Labels off
    Retry_Limit            False



apiVersion: 1

datasources:

  - name: Loki
    type: loki
    uid: "loki"
    access: proxy
    url: http://loki:3100
    isDefault: false
    allowUiUpdates: true
    jsonData:
      derivedFields:
        - name: "TraceID"
          matcherType: regex
          matcherRegex: "trace_id=(\\w+)"
          url: "$${__value.raw}"
          urlDisplayLabel: "Voir dans Tempo"
          internalLink: true
          datasourceUid: "tempo"

  - name: Tempo
    type: tempo
    uid: "tempo"
    access: proxy
    url: http://tempo:3200
    isDefault: false
    allowUiUpdates: true
    jsonData:
      tracesToLogsV2:
        enabled: true
        datasourceUid: "loki"
        filterByTraceID: true
        spanStartTimeShift: "-2s"
        spanEndTimeShift: "2s"
        tags:
          - key: "service.name"
            value: "service"

  - name: Prometheus
    type: prometheus
    uid: "prometheus"
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    allowUiUpdates: true
    jsonData:
      timeInterval: "15s"

  - name: Alertmanager
    type: alertmanager
    uid: "alertmanager"
    access: proxy
    url: http://alertmanager:9093
    isDefault: false
    allowUiUpdates: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: true